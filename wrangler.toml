name = "consulting-advice"
main = "src/worker.js"
compatibility_date = "2025-10-01"

# Static page files; /api/* always goes to the Worker code first.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
SUPABASE_URL = "https://lfkipnkachictwicshym.supabase.co"

# Secrets (Cloudflare dashboard → Workers & Pages → consulting-advice →
# Settings → Variables and Secrets, type "Secret"; never commit them):
#   SITE_PASSWORD  - the password visitors type to get in
#   SUPABASE_KEY   - the Supabase publishable key (sb_publishable_...)
